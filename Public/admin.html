<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instant Virtuals Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="admin"><section class="hero"><div class="pill">ADMIN</div><h1>Control center.</h1><p>Manage users and monitor platform usage.</p></section><section class="stats" id="stats"></section><section class="history"><label>USERS</label><h2>Accounts</h2><div id="users" class="history-list"></div></section></main><script>
async function api(url,opt={}){const t=localStorage.getItem('iv_token');const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t,'Content-Type':'application/json'}});if(r.status===403||r.status===401){document.body.innerHTML='<main class="admin"><section class="hero"><h1>Access denied.</h1><p>Sign in with an administrator account.</p></section></main>';throw Error('Access denied')}const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){const s=await api('/api/admin/stats');document.getElementById('stats').innerHTML=`<div><b>${s.users}</b><span>users</span></div><div><b>${s.verified}</b><span>verified</span></div><div><b>${s.analysesToday}</b><span>analyses today</span></div><div><b>${s.analyses}</b><span>total analyses</span></div>`;const u=await api('/api/admin/users');document.getElementById('users').innerHTML=u.map(x=>`<div class="history-card"><strong>${x.email}</strong><small>ID ${x.id} · ${x.analyses} analyses · ${x.email_verified?'verified':'unverified'} · ${x.role}</small><button onclick="toggleUser(${x.id},${!x.is_active})" class="switch">${x.is_active?'Disable':'Enable'}</button></div>`).join('')}
async function toggleUser(id,active){await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify({is_active:active})});load()}load().catch(e=>alert(e.message));
</script></body></html>
